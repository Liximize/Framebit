<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Framebit - every bit of the moment">
  <rect width="1200" height="260" fill="#000000"/>
  <g transform="translate(84 70) scale(5)" shape-rendering="crispEdges">
    <g fill="#c6a0ff">
      <rect x="4" y="2" width="9" height="3"/>
      <rect x="9" y="5" width="4" height="1"/>
      <rect x="2" y="5" width="7" height="4"/>
