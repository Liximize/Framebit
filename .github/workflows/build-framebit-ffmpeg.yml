name: Build Framebit FFmpeg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cross compiler and enable matching source packages
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm make pkg-config git curl gnupg python3 xz-utils
      - name: Build dedicated FFmpeg and source materials
        run: bash scripts/ffmpeg/build-win64.sh "$RUNNER_TEMP/framebit-ffmpeg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framebit-ffmpeg-compiled
          path: ${{ runner.temp }}/framebit-ffmpeg/
          compression-level: 0
          retention-days: 7
  windows-check:
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framebit-ffmpeg-compiled
          path: framebit-ffmpeg
      - name: Exercise the actual Windows executable
        shell: powershell
        run: '& .\framebit-ffmpeg\Test-FramebitFFmpeg.ps1 -DistributionDirectory .\framebit-ffmpeg'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framebit-ffmpeg-windows-checked
          path: framebit-ffmpeg/
          compression-level: 0
          retention-days: 7
